<style>

  var F = [["all", "Tất cả"], ["Tuần 1", "Tuần 1 (1–4)"], ["Tuần 2", "Tuần 2 (5–11)"], ["Tuần 3", "Tuần 3 (12–18)"], ["Tuần 4", "Tuần 4 (19–25)"], ["Tuần 5", "Tuần 5 (26–31)"], ["no", "Chưa thực hiện"], ["ok", "Đã thực hiện"]];
  h += '<div class="xchips">' + F.map(function (f) { return '<button class="xchip' + (MKS.f === f[0] ? " xon" : "") + '" data-xf="' + f[0] + '">' + f[1] + "</button>"; }).join("") + "</div>";
  var L = MKT.filter(function (r) { var f = MKS.f; return f === "all" || (f === "no" ? !r.th : f === "ok" ? !!r.th : r.tuan === f); });
  if (XWR[MKS.f]) h += '<div class="xdh" style="margin-top:10px;color:var(--fg)"><span>' + MKS.f + " · " + XWR[MKS.f] + "</span><span>" + L.length + " hoạt động</span></div>";
  if (!L.length) return h + '<p class="m">Không có hoạt động.</p>';
  var mob = '<div class="xmob">', cur = null;
  L.forEach(function (r) { if (r.kh !== cur) { cur = r.kh; mob += '<div class="xdh"><span>' + xdn(cur) + ", " + xdmy(cur) + " · " + esc(r.tuan) + "</span><span>" + L.filter(function (x) { return x.kh === cur; }).length + " hoạt động</span></div>"; } mob += xcard(r); });
  mob += "</div>";
  var desk = '<div class="xdesk"><table class="xmt"><thead><tr><th>Ngày kế hoạch</th><th>Ngày thực hiện</th><th>Mã KHBL</th><th>Tên hoạt động</th><th>Sản phẩm tập trung 1</th><th>Sản phẩm tập trung 2</th><th>Tuần</th></tr></thead><tbody>' +
    L.map(function (r) { return "<tr><td>" + xdmy(r.kh) + "</td><td>" + xdmy(r.th) + "</td><td><b>" + esc(r.m) + '</b><br><span class="m">' + esc(xname(r.m)) + "</span>" + xroute(r) + "</td><td>" + esc(r.hd) + "</td><td>" + esc(r.sp1) + "</td><td>" + esc(r.sp2) + "</td><td>" + esc(r.tuan) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  return h + mob + desk;
}
document.getElementById("view").addEventListener("click", function (ev) {

  v.innerHTML = note + body;

  render();
}
function curK() { return S.tab === "th" ? "th" : "kh"; }
function closeCbs() {
  var ls = document.querySelectorAll(".lb"); for (var i = 0; i < ls.length; i++) { ls[i].hidden = true; }
  var ins = document.querySelectorAll(".cbin"); for (var j = 0; j < ins.length; j++) ins[j].setAttribute("aria-expanded", "false");

function openCb(input, q) {
  var cb = input.closest(".cb"), lb = cb.querySelector(".lb"), name = cb.getAttribute("data-n");
  closeCbs();
  lb.innerHTML = cbOpts(curK(), name, q); lb.hidden = false; input.setAttribute("aria-expanded", "true");
}
function pick(name, v) {
  var k = curK(), e = S.e[k];
  if (name === "khbl") {
    e.khbl = v; e.kq = v;

function commitOvr(val) {
  var ds0 = S.dd, raw = String(val).trim();
  if (raw === "" || isNaN(+raw)) { delete S.ov[ds0]; if (DB) DB.collection("ov").doc(ds0).delete().catch(function () {}); }

function setDD(ds) {

document.getElementById("ttl").textContent = "Báo cáo ngày";

var view = document.getElementById("view");
document.getElementById("tabs").addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act=tab]"); if (!b) return;

view.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-act]");

  else if (act === "kmode") { S.kmode = t.getAttribute("data-v"); render(); }
  else if (act === "unit") { S.unit = t.getAttribute("data-v"); render(); }

  else if (act === "bcview") { S.bcview = t.getAttribute("data-v"); render(); }
  else if (act === "khview") { S.khview = t.getAttribute("data-v"); render(); }
  else if (act === "open") { var kk = t.getAttribute("data-k"); S.open[kk] = !S.open[kk]; render(); }
  else if (act === "dp") { S.dp = !S.dp; render(); }

    var did = k + ":" + t.getAttribute("data-id");

    S.delId = ""; putEntry(k, t.getAttribute("data-id"), null).then(function () { toast("Đã xóa"); render(); }, function () { toast("Chưa xóa được"); render(); });
  }

    if (!S.confReset) { S.confReset = true; render(); return; }

    if (DB) ids.forEach(function (rid) { DB.collection("route").doc(rid).delete().catch(function () {}); });
    toast("Đã khôi phục tuyến theo file");
  }
});
view.addEventListener("focusin", function (ev) {
  var t = ev.target;

view.addEventListener("click", function (ev) {

view.addEventListener("input", function (ev) {

  }
});
view.addEventListener("keydown", function (ev) {

document.addEventListener("click", function (ev) { if (!ev.target.closest(".cb")) closeCbs(); });

(async function () {

      await ld("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
