<style>

  if (!DB) { S.dbOk = (window.claude || (window.FB_CONFIG && window.FB_CONFIG.apiKey)) ? false : null; render(); return; }
  S.dbOk = true;
  ["th", "kh", "ov", "rp"].forEach(function (name) {
    DB.collection(name).onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x) m[d.id] = x; });
      var loc = Object.keys(S[name]);
      if (!snap.docs.length && loc.length && !S["up_" + name]) {
        S["up_" + name] = true;
        loc.forEach(function (id) { DB.collection(name).doc(id).set(S[name][id]).catch(function () {}); });
        return;
      }
      S[name] = m; lsSet(name, m); rebuildAct(); softRender();
    }, function () { S.dbOk = false; softRender(); });
  });
  DB.collection("route").onSnapshot(function (snap) {
    var m = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x && x.day) m[d.id] = x.day; });
    if (!snap.docs.length && Object.keys(S.route).length && !S.up_route) {
      S.up_route = true; Object.keys(S.route).forEach(function (id) { DB.collection("route").doc(id).set({ day: S.route[id] }).catch(function () {}); }); return;
    }
    S.route = m; lsSet("route", m); softRender();
  }, function () {});
  render();
})();
})();
</script>
